<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen · Offline evaluation</title>
<style>
:root{--bg:#f4f5fa;--sf:#fff;--s2:#eceef7;--tx:#14162b;--mu:#596085;--bd:#dfe2f0;--ac:#4f46e5;--sh:0 1px 2px rgba(20,22,43,.06),0 8px 24px -12px rgba(20,22,43,.18);
--c0:#9aa0bd;--c1:#0d9488;--c2:#2563eb;--c3:#d9a000;--c4:#a855f7;--c5:#e8590c;--c6:#4f46e5}
@media(prefers-color-scheme:dark){:root{--bg:#0a0c18;--sf:#12152a;--s2:#1a1e38;--tx:#eceefc;--mu:#98a0c6;--bd:#262b4c;--ac:#8f89ff;--sh:0 1px 2px rgba(0,0,0,.4);--c0:#7a82a8;--c1:#2dd4bf;--c2:#60a5fa;--c3:#f5c542;--c4:#c084fc;--c5:#ff8a4c;--c6:#8f89ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:500 15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--sf);border-bottom:1px solid var(--bd);padding:14px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logo{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 200deg,var(--c6),var(--c1),var(--c5),var(--c6))}
b.brand{font-size:19px;letter-spacing:-.02em}header span.mu{margin-left:auto}
main{max-width:1200px;margin:0 auto;padding:24px}h1{margin:0 0 4px;font-size:26px;letter-spacing:-.03em}h2{font-size:17px;margin:0 0 10px}
.mu{color:var(--mu)}.sm{font-size:13px}
.seg{display:inline-flex;background:var(--s2);padding:3px;border-radius:10px;gap:2px}.seg button{border:0;background:none;color:var(--mu);padding:6px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--sf);color:var(--tx);box-shadow:var(--sh)}
.tb{display:flex;gap:14px;flex-wrap:wrap;margin:16px 0}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:var(--sh)}
.kp .n{font-size:30px;font-weight:800;letter-spacing:-.03em}.up{color:var(--c1);font-weight:700;font-size:13px}
.g2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-top:16px}
@media(max-width:900px){.kp{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:700px;font-size:13px}
th{text-align:left;color:var(--mu);font-weight:600;padding:8px;border-bottom:1px solid var(--bd)}td{padding:8px;border-bottom:1px solid var(--bd)}
td.b{font-weight:800;color:var(--ac)}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
.fb{display:grid;grid-template-columns:110px 1fr 56px;gap:8px;align-items:center;font-size:13px;margin:6px 0}.bar{height:10px;background:var(--s2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
svg{max-width:100%;height:auto}svg text{fill:var(--mu);font:600 11px system-ui}.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mu);margin-bottom:6px}
</style></head><body>
<header><span class="logo"></span><b class="brand">Lumen</b><span class="mu sm" id="meta"></span></header>
<main id="app"></main>
<script src="metrics.js" onerror="document.getElementById('app').innerHTML='<p>metrics.js not found. Run <code>python -m lumen.cli all</code> first.</p>'"></script>
<script>
const M=window.METRICS;if(M){
const S={seg:'warm',k:'10'},P=n=>(n*100).toFixed(1)+'%',COL=i=>`var(--c${i})`,$=s=>document.querySelector(s);
const TS='Two-stage (GBDT ranker)',BASE=['Popularity','Item kNN','Matrix factorisation','Content-based'];
function draw(){
 const seg=M.segments[S.seg],at=n=>seg.models[n].at[S.k],T=at(TS),bestB=Math.max(...BASE.map(b=>at(b).recall)),best=BASE.find(b=>at(b).recall==bestB);
 const col=(key)=>Math.max(...M.models.map(m=>at(m)[key]));
 const rows=M.models.map((m,i)=>{const a=at(m);return`<tr><td><span class="dot" style="background:${COL(i)}"></span>${m}</td>${['recall','ndcg','hit','coverage','new_item_recall'].map(k=>`<td class="${a[k]==col(k)&&a[k]>0?'b':''}">${P(a[k])}</td>`).join('')}<td class="${a.novelty==col('novelty')?'b':''}">${a.novelty.toFixed(2)}</td></tr>`}).join('');
 const W=460,H=240,x=k=>44+(k-1)/49*(W-60),ymax=Math.max(...M.models.map(m=>seg.models[m].curve[49]));
 const lines=M.models.map((m,i)=>`<path d="${seg.models[m].curve.map((v,j)=>(j?'L':'M')+x(j+1).toFixed(1)+' '+(H-28-v/ymax*(H-52)).toFixed(1)).join('')}" fill="none" stroke="${COL(i)}" stroke-width="${m==TS?3:1.8}" stroke-linecap="round"/>`).join('');
 const imp=M.ranker.importance.slice(0,9),im=imp[0][1];
 $('#app').innerHTML=`<h1>Offline evaluation</h1><p class="mu" style="margin:0;max-width:75ch">Temporal split: models train on days before ${M.meta.train_cutoff} and are tested on days ${M.meta.train_cutoff}–${M.meta.horizon_days}. Cold users are first seen in the test window and get ${M.meta.cold_context_len} onboarding interactions.</p>
 <div class="tb"><div class="seg" role="group" aria-label="Segment">${[['warm','Warm users'],['cold','Cold-start users']].map(s=>`<button data-s="${s[0]}" aria-pressed="${S.seg==s[0]}">${s[1]} (${M.segments[s[0]].n.toLocaleString()})</button>`).join('')}</div>
 <div class="seg" role="group" aria-label="Cutoff">${M.ks.map(k=>`<button data-k="${k}" aria-pressed="${S.k==k}">Top ${k}</button>`).join('')}</div></div>
 <div class="kp"><div class="card"><span class="mu sm">Recall@${S.k} · two-stage</span><div class="n">${P(T.recall)}</div><span class="up">${T.recall>=bestB?'+':''}${((T.recall/bestB-1)*100).toFixed(0)}% vs best single signal (${best})</span></div>
 <div class="card"><span class="mu sm">NDCG@${S.k}</span><div class="n">${P(T.ndcg)}</div><span class="mu sm">Hit rate ${P(T.hit)}</span></div>
 <div class="card"><span class="mu sm">New-item recall@${S.k}</span><div class="n">${P(T.new_item_recall)}</div><span class="mu sm">Interaction-based models: 0%</span></div>
 <div class="card"><span class="mu sm">Latency p50 / p95</span><div class="n">${M.latency_ms.p50.toFixed(1)} ms</div><span class="mu sm">p95 ${M.latency_ms.p95.toFixed(1)} ms per request</span></div></div>
 <div class="card" style="margin-top:16px"><h2>Model comparison</h2><div class="tw"><table><thead><tr><th>Model</th><th>Recall</th><th>NDCG</th><th>Hit rate</th><th>Coverage</th><th>New-item recall</th><th>Novelty (bits)</th></tr></thead><tbody>${rows}</tbody></table></div>
 <p class="mu sm" style="margin:8px 0 0">Best value per column is highlighted. Diversity re-ranking trades a little accuracy for variety.</p></div>
 <div class="g2"><div class="card"><h2>Recall by list length</h2><div class="lg">${M.models.map((m,i)=>`<span><span class="dot" style="background:${COL(i)}"></span>${m}</span>`).join('')}</div>
 <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Recall at K by model"><line x1="44" y1="${H-28}" x2="${W-16}" y2="${H-28}" stroke="var(--bd)"/><line x1="44" y1="20" x2="44" y2="${H-28}" stroke="var(--bd)"/>${[1,10,20,30,40,50].map(k=>`<text x="${x(k)}" y="${H-10}" text-anchor="middle">${k}</text>`).join('')}<text x="38" y="26" text-anchor="end">${P(ymax)}</text><text x="38" y="${H-26}" text-anchor="end">0</text>${lines}</svg></div>
 <div class="card"><h2>Pipeline health</h2><p class="mu sm" style="margin:0 0 8px">Stage 1 hands the ranker about ${Math.round(M.retrieval.avg_candidates)} of ${M.retrieval.catalog.toLocaleString()} items per request and contains <b>${P(M.retrieval.candidate_recall)}</b> of the items users actually went on to choose. That is the ceiling for Stage 2.</p>
 <h2 style="margin-top:14px">What the ranker relies on</h2>${imp.map(f=>`<div class="fb"><span>${f[0]}</span><div class="bar"><i style="width:${Math.max(2,f[1]/im*100)}%"></i></div><span class="mu">${f[1].toFixed(3)}</span></div>`).join('')}
 <p class="mu sm" style="margin:8px 0 0">Permutation importance, drop in average precision on held-out users. Validation AP: ${M.ranker.val_average_precision.toFixed(3)}.</p></div></div>`;
 document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.seg=b.dataset.s;draw()});document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{S.k=b.dataset.k;draw()});
}
$('#meta').textContent=`${M.meta.users.toLocaleString()} users · ${M.meta.items.toLocaleString()} items · ${M.meta.interactions.toLocaleString()} interactions`;draw()}
</script></body></html>
